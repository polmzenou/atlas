openapi: 3.1.0
info:
  title: ATLAS — API Interventions v2
  version: 2.0.0
  summary: Contrat cible des interventions (liste, détail, création, modification, affectation, historique).
  description: |
    Contrat proposé par Paul Mehr (mission ATLAS, M2) pour Console Ops, Terrain et
    les futurs consommateurs. Environnement fictif : le domaine `.invalid` ne désigne
    aucun service réel et aucun secret n'est publié.

    **Version du contrat et révision d'une ressource.** `info.version` et le préfixe
    `/v2` désignent la version du *contrat*. Le champ `revision` et l'en-tête `ETag`
    désignent l'état d'*une intervention*. Ces deux notions ne sont jamais confondues.

    **Identité.** Le tenant, le rôle, l'utilisateur et le technicien éventuel sont lus
    exclusivement dans le jeton validé émis par le fournisseur d'identité
    (claims `sub`, `tenant_id`, `role`, `technician_id`). Un en-tête `X-Tenant`
    éventuellement envoyé est ignoré et n'accorde aucun droit.

    **Ordre d'évaluation commun à toutes les opérations** (règle non exprimable par
    un schéma, vérifiée par les scénarios) :
    1. 401 si l'identité est absente ou invalide ;
    2. 400 si la requête est mal formée (JSON illisible, corps qui n'est pas un objet,
       paramètre de requête invalide ou inconnu, `If-Match` mal formé) ;
       415 si le corps n'est pas `application/json` ;
    3. 404 si l'intervention n'existe pas **ou** n'est pas visible par l'appelant
       (autre tenant, ou technicien non affecté). Les deux cas sont indiscernables ;
    4. 403 si la ressource est visible mais que le rôle n'autorise jamais l'opération ;
    5. 428 si `If-Match` manque sur une mutation d'une ressource existante ;
    6. 422 si le corps viole une règle de forme ou de référence (titre, enum, champ
       inconnu, `null` interdit, site ou technicien non utilisable) ;
    7. 412 si `If-Match` ne correspond plus à la révision courante ;
    8. 409 si l'état courant interdit l'opération (transition ou modification).

    Toute erreur est un `application/problem+json` (RFC 9457) portant un `code`
    stable, choisi par le Front-End pour réagir, et un `correlationId` que le
    support utilise à la place du jeton. Aucune erreur n'est renvoyée avec 200.

    **Atomicité.** Une mutation acceptée met à jour l'intervention, incrémente
    `revision` de 1 et écrit exactement un événement d'historique dans la même
    transaction. Une requête rejetée ne modifie ni l'intervention ni l'historique.
    Une requête acceptée sans changement effectif (même valeur, même technicien)
    répond 200 sans nouvelle révision ni événement.
  contact:
    name: Paul Mehr — consultant (fictif)
servers:
  - url: https://api.atlas.invalid/v2
    description: Serveur fictif (domaine réservé .invalid)
security:
  - bearerAuth: []
tags:
  - name: Interventions
  - name: Historique
paths:
  /interventions:
    get:
      operationId: listInterventions
      tags: [Interventions]
      summary: Liste filtrée et paginée des interventions visibles
      description: |
        **Droits** : requester, planner, reporter voient tout leur tenant ;
        technician voit uniquement les interventions qui lui sont affectées.

        **Filtres** : `status` (valeur exacte) et `siteId` se combinent par ET et sont
        appliqués par le serveur sur toute la file avant pagination. Un `siteId`
        inconnu ou d'un autre tenant donne une liste vide (aucune divulgation).

        **Ordre** déterministe : `createdAt` puis `id` comme critère secondaire, dans
        le sens de `sort`. L'`id` sert uniquement à départager, il n'a pas de sens
        chronologique.

        **Pagination par curseur** (keyset) : `nextCursor` est opaque, lié aux filtres
        et au tri de la première requête. Une insertion concurrente ne provoque ni
        doublon ni saut parmi les lignes déjà ordonnées ; une ligne créée après la
        première page peut apparaître ou non selon sa position. `totalItems` est le
        décompte au moment de chaque requête (pas une photographie).

        **Effet UI** : `items` vide avec 200 = état « file vide », jamais une erreur.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Status' }
        - name: siteId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: ['-createdAt', 'createdAt']
            default: '-createdAt'
      responses:
        '200':
          description: Page de résultats (éventuellement vide).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterventionPage' }
              examples:
                filtreCombine:
                  summary: Planificateur C01, status=NEW et siteId=S01
                  x-source: Exemples_JSON/liste-200-filtre.json
                  value:
                    items:
                      - id: I100
                        tenantId: C01
                        siteId: S01
                        title: Porte bloquée accueil
                        priority: NORMAL
                        status: NEW
                        technicianId: null
                        createdAt: '2026-10-20T08:00:00Z'
                        updatedAt: '2026-10-20T08:00:00Z'
                        createdBy: U02
                        revision: 2
                    page:
                      limit: 20
                      hasNext: false
                      nextCursor: null
                      totalItems: 1
                vide:
                  summary: Site S03 sans demande
                  x-source: Exemples_JSON/liste-200-vide.json
                  value:
                    items: []
                    page:
                      limit: 20
                      hasNext: false
                      nextCursor: null
                      totalItems: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createIntervention
      tags: [Interventions]
      summary: Crée une intervention (statut NEW, sans technicien)
      description: |
        **Droits** : requester et planner. technician et reporter → 403.

        Le serveur fixe `id`, `tenantId` (depuis le jeton), `status=NEW`,
        `technicianId=null`, `createdBy`, `createdAt`, `updatedAt` et `revision=1`.
        Envoyer l'un de ces champs → 422 `UNKNOWN_FIELD`. Le titre est enregistré
        après suppression des espaces aux extrémités. `priority` absente → NORMAL.
        `siteId` doit désigner un site du tenant de l'appelant ; sinon 422
        `SITE_NOT_FOUND` (même réponse pour un site inconnu ou étranger).

        **Reprise après coupure** (facultatif) : avec `Idempotency-Key`, une
        répétition du même corps par le même utilisateur dans les 24 h renvoie la
        réponse initiale (en-tête `Idempotent-Replayed: true`) sans nouvelle
        création ; la même clé avec un autre corps → 422 `IDEMPOTENCY_KEY_REUSED`.

        **Effet UI** : naviguer vers `Location`. En cas de 422, conserver la saisie
        et afficher les erreurs par champ (`errors[].field`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterventionCreate' }
            examples:
              lina:
                summary: Lina (C01) — priorité par défaut
                x-source: Exemples_JSON/creation-requete.json
                value:
                  siteId: S01
                  title: Climatisation salle réunion
      responses:
        '201':
          description: Intervention créée.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
              examples:
                creee:
                  x-source: Exemples_JSON/creation-201.json
                  value:
                    id: I104
                    tenantId: C01
                    siteId: S01
                    title: Climatisation salle réunion
                    priority: NORMAL
                    status: NEW
                    technicianId: null
                    createdAt: '2026-10-27T09:00:01Z'
                    updatedAt: '2026-10-27T09:00:01Z'
                    createdBy: U01
                    revision: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /interventions/{interventionId}:
    parameters:
      - $ref: '#/components/parameters/InterventionId'
    get:
      operationId: getIntervention
      tags: [Interventions]
      summary: Détail d'une intervention
      description: |
        **Droits** : requester, planner, reporter (même tenant) ; technician si
        l'intervention lui est affectée. Sinon 404, identique à une absence.
        L'`ETag` retourné sert d'`If-Match` pour les mutations.

        **Effet UI** : un 404 s'affiche « Intervention introuvable ou inaccessible »
        sans prétendre à un manque de permission (le Front ne peut pas le savoir).
      responses:
        '200':
          description: Intervention visible.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
              examples:
                i101:
                  x-source: Exemples_JSON/detail-200.json
                  value:
                    id: I101
                    tenantId: C01
                    siteId: S01
                    title: Climatisation salle réunion
                    priority: NORMAL
                    status: ASSIGNED
                    technicianId: T01
                    createdAt: '2026-10-20T08:00:00Z'
                    updatedAt: '2026-10-21T09:00:00Z'
                    createdBy: U01
                    revision: 2
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateIntervention
      tags: [Interventions]
      summary: Modification partielle du titre et/ou de la priorité
      description: |
        **Sémantique des champs** (R11) : un champ **absent** est conservé ; un champ
        présent remplace la valeur ; `null` est refusé (422 `NULL_NOT_ALLOWED`) car
        titre et priorité sont obligatoires. `technicianId` et `status` ne sont **pas**
        modifiables ici (422 `FIELD_NOT_MODIFIABLE`) : l'affectation reste inchangée
        tant que la route `/assignment` n'est pas appelée ; les statuts passent par
        `/transitions`. Le retrait d'un technicien sans remplacement n'existe pas.

        **Droits et états** : requester en NEW ; planner en NEW ou ASSIGNED ;
        sinon 409 `INVALID_STATE`. technician et reporter → 403.

        **Concurrence** (R10) : `If-Match` obligatoire (428 sinon). Si la révision a
        changé depuis la lecture → 412 avec `currentRevision` ; l'écran conserve la
        saisie, relit le détail, montre l'écart et laisse l'utilisateur renvoyer.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterventionPatch' }
            examples:
              priorite:
                summary: Nora relève la priorité de I100
                x-source: Exemples_JSON/modification-requete.json
                value:
                  priority: HIGH
      responses:
        '200':
          description: État à jour (nouvelle révision si changement effectif).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
              examples:
                modifiee:
                  x-source: Exemples_JSON/modification-200.json
                  value:
                    id: I100
                    tenantId: C01
                    siteId: S01
                    title: Porte bloquée accueil
                    priority: HIGH
                    status: NEW
                    technicianId: null
                    createdAt: '2026-10-20T08:00:00Z'
                    updatedAt: '2026-10-27T09:00:01Z'
                    createdBy: U02
                    revision: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interventions/{interventionId}/assignment:
    parameters:
      - $ref: '#/components/parameters/InterventionId'
    put:
      operationId: assignIntervention
      tags: [Interventions]
      summary: Affecte ou réaffecte un technicien (NEW/ASSIGNED → ASSIGNED)
      description: |
        **Droits** : planner uniquement (autres rôles → 403).

        **Règles** (R05) : le technicien doit exister dans le tenant de l'appelant
        (sinon 422 `TECHNICIAN_NOT_FOUND`, même réponse pour inconnu ou étranger) et
        être actif (sinon 422 `TECHNICIAN_INACTIVE`). L'intervention doit être NEW ou
        ASSIGNED (sinon 409 `INVALID_STATE`). Le succès fixe `status=ASSIGNED` et
        `technicianId` dans la même transaction, avec **un seul** événement
        `ASSIGNED` ou `REASSIGNED` décrivant les deux changements.

        **Idempotence** : PUT est idempotent ; renvoyer le technicien déjà affecté
        répond 200 sans nouvelle révision ni événement. Aucun GET ne modifie l'état.

        **Concurrence** : `If-Match` obligatoire (428/412 comme pour PATCH).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRequest' }
            examples:
              t01:
                x-source: Exemples_JSON/affectation-requete.json
                value:
                  technicianId: T01
      responses:
        '200':
          description: Intervention affectée.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
              examples:
                affectee:
                  x-source: Exemples_JSON/affectation-200.json
                  value:
                    id: I100
                    tenantId: C01
                    siteId: S01
                    title: Porte bloquée accueil
                    priority: NORMAL
                    status: ASSIGNED
                    technicianId: T01
                    createdAt: '2026-10-20T08:00:00Z'
                    updatedAt: '2026-10-27T09:00:01Z'
                    createdBy: U02
                    revision: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interventions/{interventionId}/transitions:
    parameters:
      - $ref: '#/components/parameters/InterventionId'
    post:
      operationId: transitionIntervention
      tags: [Interventions]
      summary: Change le statut selon le cycle R04 (opération complémentaire)
      description: |
        Route de transition admise en plus du socle. `to` vaut IN_PROGRESS, DONE ou
        CANCELLED ; ASSIGNED s'obtient uniquement par `/assignment`.

        | to | Rôles autorisés | Statut de départ exigé |
        |---|---|---|
        | IN_PROGRESS | technician affecté | ASSIGNED |
        | DONE | technician affecté | IN_PROGRESS |
        | CANCELLED | requester, planner | NEW ou ASSIGNED |

        Rôle jamais autorisé pour cette cible → 403 (ex. planner vers IN_PROGRESS).
        Rôle autorisé mais départ invalide → 409 `INVALID_TRANSITION` (ex. DONE vers
        CANCELLED). DONE et CANCELLED sont terminaux. Pas de retour arrière.

        Ordre propre à cette route, car le droit dépend de la cible : 401, 400/415,
        404, 403 (reporter), 428, 422 (`to` invalide), 403 (rôle non autorisé pour
        cette cible), 412, 409. L'annulation conserve `technicianId` pour l'historique.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
            examples:
              demarrer:
                x-source: Exemples_JSON/transition-requete.json
                value:
                  to: IN_PROGRESS
      responses:
        '200':
          description: Statut changé.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
              examples:
                demarree:
                  summary: Samir (T01) démarre I101
                  x-source: Exemples_JSON/transition-200.json
                  value:
                    id: I101
                    tenantId: C01
                    siteId: S01
                    title: Climatisation salle réunion
                    priority: NORMAL
                    status: IN_PROGRESS
                    technicianId: T01
                    createdAt: '2026-10-20T08:00:00Z'
                    updatedAt: '2026-10-27T09:00:01Z'
                    createdBy: U01
                    revision: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /interventions/{interventionId}/events:
    parameters:
      - $ref: '#/components/parameters/InterventionId'
    get:
      operationId: listInterventionEvents
      tags: [Historique]
      summary: Historique métier d'une intervention
      description: |
        **Droits** : mêmes règles de visibilité que le détail (404 sinon).
        L'historique est en lecture seule : aucune route ne permet de l'écrire.

        Un événement `CREATED` puis un événement par mutation effective acceptée,
        ordonnés par `revision` croissante (unique par intervention). Les tentatives
        rejetées n'apparaissent pas. Le titre libre n'est jamais recopié : un
        changement de titre est signalé sans valeurs (minimisation N03).
        Pagination par curseur, `limit` 1–100 (défaut 50).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page d'événements.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
              examples:
                i100:
                  x-source: Exemples_JSON/historique-200.json
                  value:
                    items:
                      - eventId: E100-1
                        interventionId: I100
                        revision: 1
                        type: CREATED
                        at: '2026-10-20T08:00:00Z'
                        actor: { userId: U02, role: planner }
                        changes:
                          - { field: status, from: null, to: NEW }
                          - { field: priority, from: null, to: NORMAL }
                          - { field: title }
                      - eventId: E100-2
                        interventionId: I100
                        revision: 2
                        type: UPDATED
                        at: '2026-10-20T08:00:00Z'
                        actor: { userId: U02, role: planner }
                        changes:
                          - { field: title }
                      - eventId: E100-3
                        interventionId: I100
                        revision: 3
                        type: ASSIGNED
                        at: '2026-10-27T09:00:01Z'
                        actor: { userId: U02, role: planner }
                        changes:
                          - { field: technicianId, from: null, to: T01 }
                          - { field: status, from: NEW, to: ASSIGNED }
                    page:
                      limit: 50
                      hasNext: false
                      nextCursor: null
                      totalItems: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton émis et signé par le fournisseur d'identité ATLAS (existant, hors
        périmètre). Claims utilisés : `sub` (userId), `tenant_id`, `role`
        (requester | planner | technician | reporter), `technician_id` (technicien).
        Le jeton ne doit jamais être journalisé ni demandé par le support.
  parameters:
    InterventionId:
      name: interventionId
      in: path
      required: true
      description: Identifiant opaque. Aucune information (date, tenant, ordre) ne doit en être déduite.
      schema: { $ref: '#/components/schemas/Id' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag lu lors du dernier GET ou de la dernière mutation (ex. `"rev-2"`).
      schema:
        type: string
        pattern: '^"rev-[1-9][0-9]*"$'
      example: '"rev-2"'
    Limit:
      name: limit
      in: query
      required: false
      description: Taille de page. Hors bornes → 400 `INVALID_PARAMETER` (aucun écrêtage silencieux). Défaut 20 pour la liste, 50 pour l'historique.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur `nextCursor` reçue. Opaque ; invalide ou utilisé avec d'autres filtres → 400 `INVALID_CURSOR`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clé choisie par le client (UUID conseillé), portée tenant + utilisateur, conservée 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  headers:
    ETag:
      description: Révision courante de l'intervention, à renvoyer dans `If-Match`.
      schema:
        type: string
        pattern: '^"rev-[1-9][0-9]*"$'
    Location:
      description: Chemin du détail créé, relatif au serveur v2.
      schema:
        type: string
        example: /v2/interventions/I104
    XCorrelationId:
      description: Identifiant de corrélation à communiquer au support (présent sur toutes les réponses).
      schema:
        type: string
    IdempotentReplayed:
      description: Présent avec la valeur `true` lorsque la réponse rejoue une création antérieure.
      schema:
        type: string
        enum: ['true']
  responses:
    BadRequest:
      description: Requête mal formée (JSON illisible, paramètre de requête invalide, curseur invalide).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            limite:
              x-source: Exemples_JSON/erreur-400-limit.json
              value:
                type: https://api.atlas.invalid/problems/invalid-parameter
                title: Paramètre invalide
                status: 400
                code: INVALID_PARAMETER
                detail: limit doit être compris entre 1 et 100.
                correlationId: corr-0001
                errors:
                  - { field: limit, code: OUT_OF_RANGE, message: 'Valeur entre 1 et 100.' }
    Unauthorized:
      description: Identité absente, expirée ou invalide. Le Front redirige vers la connexion sans perdre la saisie.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer realm="atlas"' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            sansJeton:
              x-source: Exemples_JSON/erreur-401.json
              value:
                type: https://api.atlas.invalid/problems/unauthenticated
                title: Authentification requise
                status: 401
                code: UNAUTHENTICATED
                correlationId: corr-0002
    Forbidden:
      description: Ressource visible mais rôle insuffisant. Le Front masque l'action et affiche « action non autorisée pour votre rôle ».
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            reporter:
              x-source: Exemples_JSON/erreur-403.json
              value:
                type: https://api.atlas.invalid/problems/forbidden
                title: Action non autorisée
                status: 403
                code: FORBIDDEN
                detail: Le rôle reporter ne peut pas modifier une intervention.
                correlationId: corr-0003
    NotFound:
      description: Intervention absente ou non visible (autre tenant, technicien non affecté). Indiscernables par construction.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            introuvable:
              x-source: Exemples_JSON/erreur-404.json
              value:
                type: https://api.atlas.invalid/problems/not-found
                title: Intervention introuvable
                status: 404
                code: NOT_FOUND
                correlationId: corr-0004
    Conflict:
      description: L'état courant interdit l'opération. Le Front relit le détail et retire l'action devenue impossible.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            terminal:
              x-source: Exemples_JSON/erreur-409.json
              value:
                type: https://api.atlas.invalid/problems/invalid-transition
                title: Transition interdite
                status: 409
                code: INVALID_TRANSITION
                detail: DONE est un état terminal.
                correlationId: corr-0005
                currentStatus: DONE
    PreconditionFailed:
      description: Révision périmée. Le Front conserve la saisie, relit, présente l'écart et laisse renvoyer.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            perime:
              x-source: Exemples_JSON/erreur-412.json
              value:
                type: https://api.atlas.invalid/problems/precondition-failed
                title: Intervention modifiée entre-temps
                status: 412
                code: PRECONDITION_FAILED
                detail: If-Match "rev-2" ne correspond plus à la révision 3.
                correlationId: corr-0006
                currentRevision: 3
    PreconditionRequired:
      description: Mutation sans `If-Match` (défaut d'intégration, pas une erreur utilisateur).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            manquant:
              x-source: Exemples_JSON/erreur-428.json
              value:
                type: https://api.atlas.invalid/problems/precondition-required
                title: En-tête If-Match obligatoire
                status: 428
                code: PRECONDITION_REQUIRED
                correlationId: corr-0007
    UnsupportedMediaType:
      description: Corps non `application/json`.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Corps valide en JSON mais contraire au contrat ou aux référentiels. Le Front garde la saisie et marque les champs cités.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/XCorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            titre:
              x-source: Exemples_JSON/erreur-422-titre.json
              value:
                type: https://api.atlas.invalid/problems/validation-failed
                title: Données invalides
                status: 422
                code: VALIDATION_FAILED
                correlationId: corr-0008
                errors:
                  - { field: title, code: INVALID_LENGTH, message: 'Le titre doit contenir 5 à 120 caractères hors espaces aux extrémités.' }
            technicien:
              x-source: Exemples_JSON/erreur-422-technicien.json
              value:
                type: https://api.atlas.invalid/problems/validation-failed
                title: Données invalides
                status: 422
                code: VALIDATION_FAILED
                correlationId: corr-0009
                errors:
                  - { field: technicianId, code: TECHNICIAN_NOT_FOUND, message: 'Technicien inconnu dans votre organisation.' }
  schemas:
    Id:
      type: string
      description: Identifiant opaque et stable (chaîne, jamais un entier).
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    Instant:
      type: string
      format: date-time
      description: Instant UTC RFC 3339 terminé par Z. L'affichage local relève des interfaces.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH]
    Status:
      type: string
      enum: [NEW, ASSIGNED, IN_PROGRESS, DONE, CANCELLED]
      description: DONE et CANCELLED sont terminaux.
    Role:
      type: string
      enum: [requester, planner, technician, reporter]
    Intervention:
      type: object
      additionalProperties: false
      required: [id, tenantId, siteId, title, priority, status, technicianId, createdAt, updatedAt, createdBy, revision]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        tenantId: { $ref: '#/components/schemas/Id' }
        siteId: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          minLength: 5
          maxLength: 120
          description: Titre déjà normalisé (sans espaces aux extrémités).
          pattern: '^\S([\s\S]*\S)?$'
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        technicianId:
          description: Toujours présent ; `null` uniquement en NEW (ou CANCELLED depuis NEW).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
        createdBy: { $ref: '#/components/schemas/Id' }
        revision:
          type: integer
          minimum: 1
          description: Révision de la ressource, +1 par mutation effective. Exposée aussi via ETag.
    InterventionCreate:
      type: object
      additionalProperties: false
      required: [siteId, title]
      properties:
        siteId: { $ref: '#/components/schemas/Id' }
        title:
          type: string
          description: 5 à 120 caractères après suppression des espaces aux extrémités (R02).
          pattern: '^\s*\S[\s\S]{3,118}\S\s*$'
        priority:
          $ref: '#/components/schemas/Priority'
          description: Absente → NORMAL. `null` refusé.
    InterventionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Champ absent = conservé. `null` refusé. technicianId/status interdits ici.
      properties:
        title:
          type: string
          pattern: '^\s*\S[\s\S]{3,118}\S\s*$'
        priority: { $ref: '#/components/schemas/Priority' }
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [technicianId]
      properties:
        technicianId: { $ref: '#/components/schemas/Id' }
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          enum: [IN_PROGRESS, DONE, CANCELLED]
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, hasNext, nextCursor, totalItems]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        hasNext: { type: boolean }
        nextCursor:
          description: '`null` si et seulement si `hasNext` vaut false.'
          oneOf:
            - { type: string, minLength: 1 }
            - { type: 'null' }
        totalItems:
          type: integer
          minimum: 0
          description: Nombre d'éléments correspondant aux filtres au moment de la requête.
    InterventionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Intervention' }
        page: { $ref: '#/components/schemas/PageInfo' }
    Actor:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
    FieldChange:
      type: object
      additionalProperties: false
      required: [field]
      description: Pour `title`, ni `from` ni `to` ne sont fournis (texte libre non recopié).
      properties:
        field:
          type: string
          enum: [title, priority, status, technicianId]
        from:
          oneOf:
            - { type: string }
            - { type: 'null' }
        to:
          oneOf:
            - { type: string }
            - { type: 'null' }
      if:
        properties:
          field: { const: title }
      then:
        not:
          anyOf:
            - required: [from]
            - required: [to]
      else:
        required: [from, to]
    EventType:
      type: string
      enum: [CREATED, UPDATED, ASSIGNED, REASSIGNED, STATUS_CHANGED]
    Event:
      type: object
      additionalProperties: false
      required: [eventId, interventionId, revision, type, at, actor, changes]
      properties:
        eventId: { $ref: '#/components/schemas/Id' }
        interventionId: { $ref: '#/components/schemas/Id' }
        revision:
          type: integer
          minimum: 1
          description: Révision de l'intervention produite par cet événement.
        type: { $ref: '#/components/schemas/EventType' }
        at: { $ref: '#/components/schemas/Instant' }
        actor: { $ref: '#/components/schemas/Actor' }
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FieldChange' }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Event' }
        page: { $ref: '#/components/schemas/PageInfo' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Nom du champ du corps ou du paramètre concerné.
        code:
          type: string
          enum: [REQUIRED, NULL_NOT_ALLOWED, INVALID_TYPE, INVALID_LENGTH, INVALID_VALUE, OUT_OF_RANGE,
                 UNKNOWN_FIELD, FIELD_NOT_MODIFIABLE, EMPTY_PATCH, SITE_NOT_FOUND,
                 TECHNICIAN_NOT_FOUND, TECHNICIAN_INACTIVE]
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 enrichi d'un `code` stable et d'un `correlationId`.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, INVALID_PARAMETER, INVALID_CURSOR,
                 MALFORMED_REQUEST, UNSUPPORTED_MEDIA_TYPE, VALIDATION_FAILED,
                 IDEMPOTENCY_KEY_REUSED, PRECONDITION_REQUIRED, PRECONDITION_FAILED,
                 INVALID_STATE, INVALID_TRANSITION]
        detail: { type: string }
        correlationId: { type: string, minLength: 1 }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        currentRevision:
          type: integer
          minimum: 1
          description: Fourni avec 412.
        currentStatus:
          $ref: '#/components/schemas/Status'
          description: Fourni avec 409.
